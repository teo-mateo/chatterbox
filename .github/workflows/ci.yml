name: ci

# Runs for every push to main, which includes merged pull requests.
on:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: Build
        run: make build
      - name: Vet
        run: go vet ./...
      - name: Staticcheck
        run: go run honnef.co/go/tools/cmd/staticcheck@2025.1.1 ./...
      - name: Unit tests
        run: go test -race ./internal/...
      - name: Cache the pinned Ergo release
        uses: actions/cache@v4
        with:
          path: ~/.cache/chatterbox-test/ergo
          key: ergo-${{ runner.os }}-${{ hashFiles('test/ergo/ergo.go') }}
      - name: Integration and acceptance tests
        run: go test -count=1 -timeout 20m ./test/...
      - name: Release builds
        run: |
          make release VERSION="main-${GITHUB_SHA::7}"
          mkdir publish
          for arch in amd64 arm64; do
            cp "dist/chatterbox-main-${GITHUB_SHA::7}-linux-$arch" "publish/chatterbox-linux-$arch"
          done
          (cd publish && sha256sum chatterbox-linux-* > SHA256SUMS)
      - uses: actions/upload-artifact@v4
        with:
          name: binaries
          path: publish/
          retention-days: 1

  # Replaces the "latest" release with the binaries of this commit, so that
  # the download addresses stay the same.
  publish:
    needs: test
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: binaries
          path: publish
      - name: Publish the latest build
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          gh release delete latest --cleanup-tag --yes || true
          gh release create latest --target "$GITHUB_SHA" \
            --title "Latest build of main" \
            --notes "Linux binaries built from ${GITHUB_SHA}. Replaced on every push to main. Install with scripts/install.sh." \
            publish/chatterbox-linux-amd64 publish/chatterbox-linux-arm64 publish/SHA256SUMS
