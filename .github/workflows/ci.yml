name: ci

# Runs for every push to main, which includes merged pull requests, and for
# every version tag. A push to main publishes the rolling "edge" build; a tag
# v1.2.3 publishes the release of that name.
on:
  push:
    branches: [main]
    tags: ['v*']

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # the version comes from the tags
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: Build
        run: make build
      - name: Vet
        run: go vet ./...
      - name: Staticcheck
        run: go run honnef.co/go/tools/cmd/staticcheck@2025.1.1 ./...
      - name: Unit tests
        run: go test -race ./internal/...
      - name: Cache the pinned Ergo release
        uses: actions/cache@v4
        with:
          path: ~/.cache/chatterbox-test/ergo
          key: ergo-${{ runner.os }}-${{ hashFiles('test/ergo/ergo.go') }}
      - name: Integration and acceptance tests
        run: go test -count=1 -timeout 20m ./test/...
      - name: Release builds
        run: |
          if [ "$GITHUB_REF_TYPE" = tag ]; then
            version="$GITHUB_REF_NAME"
          else
            version="$(git describe --tags --match 'v*' --always)"
          fi
          echo "version $version"
          make release VERSION="$version"
          mkdir publish
          for arch in amd64 arm64; do
            cp "dist/chatterbox-$version-linux-$arch" "publish/chatterbox-linux-$arch"
          done
          (cd publish && sha256sum chatterbox-linux-* > SHA256SUMS)
      - uses: actions/upload-artifact@v4
        with:
          name: binaries
          path: publish/
          retention-days: 1

  # A version tag gets a release of its own. A push to main replaces the
  # "edge" release, so that its download addresses stay the same.
  publish:
    needs: test
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: binaries
          path: publish
      - name: Publish
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          set -- publish/chatterbox-linux-amd64 publish/chatterbox-linux-arm64 publish/SHA256SUMS
          if [ "$GITHUB_REF_TYPE" = tag ]; then
            gh release create "$GITHUB_REF_NAME" --verify-tag --title "$GITHUB_REF_NAME" --generate-notes "$@"
          else
            gh release delete edge --cleanup-tag --yes || true
            gh release create edge --target "$GITHUB_SHA" --prerelease --latest=false \
              --title "Edge: latest build of main" \
              --notes "Unreleased Linux binaries built from ${GITHUB_SHA}. Replaced on every push to main. Install with: CHATTERBOX_VERSION=edge sh scripts/install.sh" \
              "$@"
          fi
